name: Linux AppImage

# Builds Distill for Linux on GitHub's Ubuntu runners, so a Linux build can be made without owning a Linux machine.
# Every push and every manual run leaves a downloadable AppImage in the run's "Artifacts" section.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          glib=libglib2.0-0t64
          apt-cache show "$glib" >/dev/null 2>&1 || glib=libglib2.0-0
          sudo apt-get install -y file curl ca-certificates \
              libegl1 libopengl0 libxkbcommon0 libdbus-1-3 "$glib" libfontconfig1 libfreetype6 libpulse0 libgl1 \
              libx11-6 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
              libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libxcb-xinerama0 \
              libwayland-client0 libwayland-cursor0 libwayland-egl1
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.6"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/ci_unittest.py --timeout 600 -- python -m unittest discover -s tests -t .

      # After the tests, which expect the checked-in two-part version; the build and both packages carry the tag.
      - name: Stamp the version from the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"v\d+(\.\d+)*", tag, re.ASCII):
              raise SystemExit(f"Tag {tag} must look like v1.2 or v1.2.3")
          for path, pattern, new in (
              ("distill/constants.py", r'APP_VERSION = "[^"]*"', f'APP_VERSION = "{tag}"'),
              ("pyproject.toml", r'(?m)^version = "[^"]*"', f'version = "{tag[1:]}"'),
          ):
              text = open(path, encoding="utf-8", newline="").read()
              text, n = re.subn(pattern, new, text, count=1)
              if n != 1:
                  raise SystemExit(f"Could not stamp {path}")
              open(path, "w", encoding="utf-8", newline="").write(text)
          print("Version set to", tag)
          PY

      - name: Build the bundle
        run: pyinstaller --noconfirm distill-linux.spec

      - name: Package the amd64 DEB
        run: bash packaging/build-deb.sh

      - name: Package the AppImage
        run: |
          set -euo pipefail
          curl -sL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          rm -rf AppDir
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps AppDir/usr/share/applications
          cp -r dist/Distill AppDir/Distill
          cp packaging/AppRun AppDir/AppRun && chmod +x AppDir/AppRun
          cp packaging/distill.desktop AppDir/distill.desktop
          cp packaging/distill.desktop AppDir/usr/share/applications/distill.desktop
          cp distill.png AppDir/distill.png
          cp distill.png AppDir/usr/share/icons/hicolor/256x256/apps/distill.png
          # No FUSE on a runner, so appimagetool unpacks itself instead of mounting.
          cd /tmp && APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool --no-appstream "$GITHUB_WORKSPACE/AppDir" "$GITHUB_WORKSPACE/Distill-x86_64.AppImage"
          cd "$GITHUB_WORKSPACE"
          sha256sum Distill-x86_64.AppImage > Distill-x86_64.AppImage.sha256
          cat Distill-x86_64.AppImage.sha256

      - name: Smoke test the packaged app
        # The same check the Windows build runs: start the real program and make it build its window.
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/distill-config" XDG_DATA_HOME="$RUNNER_TEMP/distill-data"
          export XDG_STATE_HOME="$RUNNER_TEMP/distill-state" XDG_CACHE_HOME="$RUNNER_TEMP/distill-cache"
          export APPIMAGE_EXTRACT_AND_RUN=1
          QT_QPA_PLATFORM=offscreen ./Distill-x86_64.AppImage --self-test /tmp/report.txt
          cat /tmp/report.txt
          # A tagged build must report the tag as its version, or the DEB and AppImage would disagree with the release.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]] && ! grep -qF "Distill $GITHUB_REF_NAME:" /tmp/report.txt; then
              echo "The built program does not report version $GITHUB_REF_NAME." >&2
              exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Distill-AppImage
          path: |
            Distill-x86_64.AppImage
            Distill-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: Distill-DEB
          path: |
            dist/distill_*_amd64.deb
            dist/distill_*_amd64.deb.sha256
          if-no-files-found: error
          retention-days: 30
